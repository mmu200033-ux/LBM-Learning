    #lbm-minimal-v6 .lb-scene-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:11px 16px;border-top:1px solid var(--lb-line);font-size:11px;color:var(--lb-muted)}

    #lbm-minimal-v6 .lb-controls-left{display:flex;gap:7px}

    const labels=['时间步开始 · Fⁿ','迁移 · 含边界反弹分量释放','碰撞 · 同一格点内重新分配','反弹 · 边界分量暂存并反向'];
    const captions=['当前：时间步开始','当前：迁移后 · 边界格点的反弹分量进入流体层','当前：碰撞后 · Δ 相对碰撞前','当前：反弹后 · 分量暂存在圆形边界格点'];
    const saved=window.openai?.widgetState?.modelContent;
    let stage=Number.isInteger(saved?.stage)?Math.max(0,Math.min(3,saved.stage)):0;
    let selectedX=Number.isInteger(saved?.x)?Math.max(0,Math.min(39,saved.x)):15;
    let selectedY=Number.isInteger(saved?.y)?Math.max(0,Math.min(15,saved.y)):8;
    let field=saved?.field==='speed'?'speed':'vorticity';
    let progress=1,frame=0,playing=false,sequence=0;
    const board=find('.lb-lattice'),flow=find('.lb-flow-canvas');
    const fluidCount=data.solid.reduce((sum,value)=>sum+(value?0:1),0);
    const cards=find('[data-populations]');
    order.forEach(i=>{const card=document.createElement('div');card.className='lb-pop'+(i===0?' rest':'');card.dataset.direction=i;card.innerHTML='<div class="lb-pop-top"><span class="lb-pop-symbol">f<sub>'+i+'</sub></span><span>'+names[i]+'</span></div><div class="lb-pop-value">—</div><div class="lb-pop-delta">Δ —</div>';cards.appendChild(card);});
    const bounceLinks=[];
    for(let y=0;y<16;y++)for(let x=0;x<40;x++){
      const fluid=y*40+x;

        const wx=x+dirs[i][0],wy=y+dirs[i][1];
        if(wx>=0&&wx<40&&wy>=0&&wy<16&&data.solid[wy*40+wx])bounceLinks.push({x,y,i,index:fluid});
      }
    }
    let boardLayout=null;
    function save(){window.openai?.setWidgetState?.({modelContent:{stage,x:selectedX,y:selectedY,field},privateContent:null})?.catch(()=>{});}
    function surface(canvas){const box=canvas.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(box.width*dpr));canvas.height=Math.max(1,Math.round(box.height*dpr));const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx,w:box.width,h:box.height};}
    function selectedArrays(){return{current:data.stages[Math.min(stage,3)],previous:data.stages[Math.max(0,stage-1)]};}
    function drawBoard(){
      const {ctx,w,h}=surface(board);ctx.clearRect(0,0,w,h);

      const collisionPulse=stage===2?(0.55+0.45*Math.sin(progress*Math.PI*4)):0;
      find('[data-collision-status]').textContent=stage===2?('全场碰撞重算 · '+Math.round(progress*100)+'% · '+fluidCount+' 个流体格点'):stage===3?'反弹分量暂存于圆形边界':'深浅表示数值';

      for(let y=0;y<16;y++)for(let x=0;x<40;x++){
        const n=y*40+x,left=ox+x*cell,top=oy+y*cell;

        let changeEnergy=0;
        if(stage===2&&!data.solid[n]){
          for(let j=0;j<9;j++)changeEnergy+=Math.abs(current[n*9+j]-previous[n*9+j]);

          ctx.fillRect(left+0.7,top+0.7,cell-1.4,cell-1.4);
        }
        if(x===selectedX&&y===selectedY){
          ctx.fillStyle=stage===0?'#f7edc0':stage===1?'#e6f1eb':stage===2?'#e8eef3':stage===3?'#f4e9df':'#e9f1eb';
          ctx.fillRect(left,top,cell,cell);
        }
        for(let i=0;i<9;i++){
          const delta=current[n*9+i]-previous[n*9+i];
          const val=Math.max(0,stage===1?current[n*9+i]:previous[n*9+i]+delta*progress);
          const opacity=.26+.74*Math.min(1,Math.sqrt(val/45));
          const unit=cell*.275,size=Math.max(.9,cell*.155);
          let px=left+cell/2+dirs[i][0]*unit,py=top+cell/2+dirs[i][1]*unit;
          if(stage===1&&progress<1){px-=dirs[i][0]*cell*(1-progress);py-=dirs[i][1]*cell*(1-progress);}
          if(px<ox||px>ox+40*cell||py<oy||py>oy+16*cell)continue;

          const visibleSize=stage===2?Math.max(.8,Math.min(cell*.3,cell*(.055+.22*Math.sqrt(Math.max(0,val)/45)))):size;
          if(stage===2&&Math.abs(delta)>.012){
            ctx.strokeStyle='rgba(189,145,65,'+(0.18+0.36*(1-progress)).toFixed(3)+')';ctx.lineWidth=.55;
            ctx.strokeRect(px-beforeSize/2,py-beforeSize/2,beforeSize,beforeSize);

      ctx.font='10px Consolas,monospace';ctx.fillStyle='#89928b';ctx.textAlign='left';ctx.fillText('0',ox,oy-9);ctx.textAlign='right';ctx.fillText('x 39',ox+40*cell,oy-9);ctx.fillText('y 15',ox+40*cell,oy+16*cell+18);
    }
    function popSize(value,cell,boost=1){
      return Math.max(3,Math.min(cell*.34,cell*.09+Math.sqrt(Math.max(0,Number(value)||0))*.48*boost));
    }
    function drawSelectedEffect(ctx,left,top,cell,p){
      const cx=left+cell/2,cy=top+cell/2;
      if(stage===0){
        ctx.strokeStyle='#b28a2d';ctx.lineWidth=2.2;ctx.strokeRect(left+1.5,top+1.5,cell-3,cell-3);

      }
      const {current,previous}=selectedArrays(),start=(selectedY*40+selectedX)*9;
      if(stage===1){
        ctx.fillStyle='rgba(50,103,102,.08)';ctx.fillRect(left,top,cell,cell);
        ctx.strokeStyle='#326766';ctx.lineWidth=1.35;
        const mark=Math.max(3,cell*.18);
        ctx.beginPath();ctx.moveTo(left+1,top+mark);ctx.lineTo(left+1,top+1);ctx.lineTo(left+mark,top+1);ctx.moveTo(left+cell-mark,top+cell-1);ctx.lineTo(left+cell-1,top+cell-1);ctx.lineTo(left+cell-1,top+cell-mark);ctx.stroke();
        for(let i=1;i<9;i++){
          const dx=dirs[i][0],dy=dirs[i][1];
          const outSize=popSize(previous[start+i],cell,1.15),tx=cx+dx*cell,ty=cy+dy*cell;
          ctx.fillStyle='#326766';ctx.globalAlpha=.95;ctx.fillRect(cx+(tx-cx)*p-outSize/2,cy+(ty-cy)*p-outSize/2,outSize,outSize);
          const sx=selectedX-dx,sy=selectedY-dy;
          if(sx>=0&&sx<40&&sy>=0&&sy<16){
            const incomingStart=(sy*40+sx)*9,inSize=popSize(previous[incomingStart+i],cell,1.15);
            const ix=cx-dx*cell,iy=cy-dy*cell;
            ctx.fillStyle='#bd9141';ctx.globalAlpha=.95;ctx.fillRect(ix+(cx-ix)*p-inSize/2,iy+(cy-iy)*p-inSize/2,inSize,inSize);
          }

        ctx.globalAlpha=1;ctx.fillStyle='#326766';ctx.globalAlpha=.16;ctx.fillRect(left,top,cell,cell);ctx.globalAlpha=1;
        return;
      }else if(stage===2){
        for(let i=0;i<9;i++){
          const dx=dirs[i][0],dy=dirs[i][1],oldV=previous[start+i],newV=current[start+i];
          const oldSize=popSize(oldV,cell),newSize=popSize(newV,cell,1.06),size=oldSize+(newSize-oldSize)*p;

          ctx.fillStyle=i===0?'#264f4b':'#567b99';ctx.globalAlpha=.28+.68*p;ctx.fillRect(px-size/2,py-size/2,size,size);

      }
      ctx.strokeStyle=stage===2?'#567b99':stage===3?'#b86b45':'#326766';ctx.lineWidth=2.1;ctx.strokeRect(left+1,top+1,cell-2,cell-2);
      ctx.globalAlpha=1;
    }
    function drawBounceEffect(ctx,ox,oy,cell,p){
      if(!bounceLinks.length)return;
      const focus=bounceLinks.find(link=>link.x===selectedX&&link.y===selectedY)||bounceLinks[Math.floor(bounceLinks.length/2)];
      for(const link of bounceLinks){
        const cx=ox+link.x*cell+cell/2,cy=oy+link.y*cell+cell/2,dx=dirs[link.i][0],dy=dirs[link.i][1];

        const wallX=cx+dx*cell*.5,wallY=cy+dy*cell*.5;
        const solidCx=cx+dx*cell,solidCy=cy+dy*cell;
        const storedX=solidCx-dx*cell*.27,storedY=solidCy-dy*cell*.27;
        const returnedX=cx-dx*cell*.27,returnedY=cy-dy*cell*.27;

          ctx.beginPath();ctx.arc(px,py,Math.max(3.2,size*.86*pulse),0,Math.PI*2);ctx.stroke();
          ctx.beginPath();ctx.arc(wallX,wallY,Math.max(2.5,cell*.15),0,Math.PI*2);ctx.stroke();
        }else{

          if(isFocus&&stage===1){
            ctx.strokeStyle='#326766';ctx.lineWidth=1.2;ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(wallX,wallY,Math.max(2.5,cell*.12),0,Math.PI*2);ctx.stroke();

      }

    }
    function updateInspector(blend=1){
      const {current,previous}=selectedArrays(),start=(selectedY*40+selectedX)*9;
      const t=stage>=1&&stage<=3?Math.max(0,Math.min(1,blend)):1;
      let rho=0,mx=0,my=0;
      for(let i=0;i<9;i++){
        const delta=current[start+i]-previous[start+i],value=previous[start+i]+delta*t;rho+=value;mx+=value*dirs[i][0];my-=value*dirs[i][1];
        const card=cards.querySelector('[data-direction="'+i+'"]');
        card.querySelector('.lb-pop-value').textContent=value.toFixed(3);
        const d=card.querySelector('.lb-pop-delta');d.textContent='Δ '+(delta>=0?'+':'−')+Math.abs(delta).toFixed(4);d.className='lb-pop-delta'+(Math.abs(delta)<.00005?'':delta>0?' positive':' negative');
      }
      const isSolid=Boolean(data.solid[selectedY*40+selectedX]);
      find('.lb-selection-label').textContent=isSolid?'障碍格点':'选中格点';
      find('[data-rho]').textContent=isSolid?'—':rho.toFixed(3);find('[data-ux]').textContent=isSolid?'—':(mx/rho).toFixed(4);find('[data-uy]').textContent=isSolid?'—':(my/rho).toFixed(4);
      find('[data-comparison]').textContent=captions[stage];
      find('[aria-label="格点 x 坐标"]').value=selectedX;find('[aria-label="格点 y 坐标"]').value=selectedY;
    }
    function updateLabels(){
      root.querySelectorAll('[data-stage]').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.stage)===stage)));
      find('[data-stage-name]').textContent=labels[stage];
      find('[data-time]').textContent='n = '+(113+(stage===3?1:0));
      find('[data-live]').textContent=(stage===3?'时间步完成':labels[stage].split(' · ')[0]+'完成')+' · 可选择格点查看九个分量';
      updateInspector();
    }
    function setStage(value,animate=true){
      cancelAnimationFrame(frame);stage=value;progress=1;updateLabels();save();
      if(!animate||matchMedia('(prefers-reduced-motion: reduce)').matches||stage===0){drawBoard();return;}
      const start=performance.now(),duration=700/Number(find('[aria-label="演示速度"]').value);progress=0;updateInspector(progress);
      const tick=now=>{progress=Math.min(1,(now-start)/duration);updateInspector(progress);drawBoard();if(progress<1)frame=requestAnimationFrame(tick);};frame=requestAnimationFrame(tick);
    }
    function drawFlow(){
      const {ctx,w,h}=surface(flow),fw=data.flow.nx,fh=data.flow.ny;
      const imageCanvas=document.createElement('canvas');imageCanvas.width=fw;imageCanvas.height=fh;
      const ic=imageCanvas.getContext('2d'),pixels=ic.createImageData(fw,fh),values=data.flow[field];
      const neutral=[252,252,250],blue=[58,104,169],red=[196,77,65];
      for(let y=0;y<fh;y++)for(let x=0;x<fw;x++){
        const n=y*fw+x,solid=(x-fw/4)**2+(y-fh/2)**2<(fh/4)**2;
        const raw=values[n]/(field==='speed'?255:127),amount=Math.pow(Math.abs(raw),.62),color=field==='speed'||raw<0?blue:red;

      find('.lb-color-strip').style.background=field==='speed'?'linear-gradient(90deg,#fcfcfa,#3c71ba)':'linear-gradient(90deg,#3c71ba,#fcfcfa,#c7564c)';
    }
    function selectCell(x,y){selectedX=x;selectedY=y;updateInspector();drawBoard();save();find('[data-live]').textContent=data.solid[y*40+x]?'障碍格点 · 显示用于反弹的九个存储分量':'流体格点 · 九分量随阶段更新';}
    board.addEventListener('click',event=>{const r=board.getBoundingClientRect(),p=boardLayout;if(!p)return;const x=Math.floor((event.clientX-r.left-p.ox)/p.cell),y=Math.floor((event.clientY-r.top-p.oy)/p.cell);if(x>=0&&x<40&&y>=0&&y<16)selectCell(x,y);});

    root.querySelectorAll('[data-stage]').forEach(button=>button.addEventListener('click',()=>{stop();setStage(Number(button.dataset.stage));}));

    find('[aria-label="演示速度"]').addEventListener('input',event=>find('[data-speed]').textContent=Number(event.target.value).toFixed(1)+'×');
    root.querySelectorAll('[data-field]').forEach(button=>button.addEventListener('click',()=>{field=button.dataset.field;drawFlow();save();}));
    const observer=new ResizeObserver(()=>{drawBoard();drawFlow();});observer.observe(board);observer.observe(flow);
    window.addEventListener('openai:set_globals',event=>{const s=event.detail?.globals?.widgetState?.modelContent;if(!s)return;stage=Number.isInteger(s.stage)?Math.max(0,Math.min(3,s.stage)):stage;selectedX=Number.isInteger(s.x)?Math.max(0,Math.min(39,s.x)):selectedX;selectedY=Number.isInteger(s.y)?Math.max(0,Math.min(15,s.y)):selectedY;field=s.field==='speed'?'speed':'vorticity';progress=1;updateLabels();drawBoard();drawFlow();});
    updateLabels();drawBoard();drawFlow();
    if(globalThis.Tweak){const design={spacing:24};const tweak=new Tweak({container:root,onChange:()=>root.style.setProperty('--lb-space',design.spacing+'px')});tweak.addSlider(design,'spacing',{label:'区域间距',min:16,max:40,step:4,unit:'px'});}
  })();
